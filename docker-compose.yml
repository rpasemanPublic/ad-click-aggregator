services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ad-click-aggregator-kraft-cluster

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ad_click_aggregator
    volumes:
      - postgres-data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:12.11.0
    container_name: flyway
    command: -url=jdbc:postgresql://postgres:5432/ad_click_aggregator -user=postgres -password=postgres -connectRetries=10 migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - postgres

  seed:
    image: postgres:16-alpine
    container_name: seed
    command: psql -h postgres -U postgres -d ad_click_aggregator -f /seed.sql
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./db/seed.sql:/seed.sql
    depends_on:
      flyway:
        condition: service_completed_successfully

  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started

  register-hot-ads-connector:
    image: curlimages/curl:8.11.0
    container_name: register-hot-ads-connector
    volumes:
      - ./debezium/hot-ads-connector.json:/hot-ads-connector.json
    command:
      - --retry
      - "20"
      - --retry-connrefused
      - --retry-delay
      - "3"
      - --fail
      - -X
      - PUT
      - -H
      - "Content-Type: application/json"
      - -d
      - "@/hot-ads-connector.json"
      - http://kafka-connect:8083/connectors/hot-ads-connector/config
    depends_on:
      kafka-connect:
        condition: service_started
      seed:
        condition: service_completed_successfully

  record-click-service:
    build: ./record-click-service
    container_name: record-click-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      KAFKA_BROKER: kafka:9092
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ad_click_aggregator
    depends_on:
      kafka:
        condition: service_started
      seed:
        condition: service_completed_successfully

  kafka-streams-app:
    build: ./kafka-streams-app
    environment:
      KAFKA_BROKER: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/ad_click_aggregator
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      kafka:
        condition: service_started
      flyway:
        condition: service_completed_successfully

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ad_click_aggregator
    depends_on:
      flyway:
        condition: service_completed_successfully

  ad-click-simulator:
    build: ./ad-click-simulator
    container_name: ad-click-simulator
    ports:
      - "5173:5173"
    depends_on:
      - record-click-service

  analytics-dashboard:
    build: ./analytics-dashboard
    container_name: analytics-dashboard
    ports:
      - "5174:5174"
    depends_on:
      - analytics-service

volumes:
  postgres-data:
